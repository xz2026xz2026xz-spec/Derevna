<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Деревня 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background-color: #1a1525; font-family: system-ui, sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  
  .search {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 400px; z-index: 10; background: rgba(255,255,255,0.95);
    border-radius: 22px; padding: 10px 16px; display: flex; align-items: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4); pointer-events: auto;
  }
  .search input { border: none; outline: none; background: transparent; font-size: 15px; width: 100%; margin-left: 8px; }
</style>
<!-- Подключаем Three.js и OrbitControls -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="search">
  <span>🔍</span>
  <input type="text" placeholder="где мой дом">
</div>
<div id="canvas-container"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 1. Настройка сцены
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1525'); // Темный фон
scene.fog = new THREE.Fog('#1a1525', 200, 500);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
camera.position.set(150, 150, 150); // Изометрический вид

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// 2. Управление (вращение пальцем/мышкой)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; // Плавность
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.1; // Не даем камере уйти под землю
controls.minDistance = 50;
controls.maxDistance = 400;

// 3. Освещение
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Общий свет
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(100, 200, 100);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -200;
dirLight.shadow.camera.right = 200;
dirLight.shadow.camera.top = 200;
dirLight.shadow.camera.bottom = -200;
scene.add(dirLight);

// 4. Генерация карты (12x12)
const N = 12;
const SIZE = 20; // Размер одной клетки

// Группа для всей карты
const mapGroup = new THREE.Group();
scene.add(mapGroup);

// Создаем участки и дороги
for (let x = 0; x < N; x++) {
  for (let z = 0; z < N; z++) {
    // Трава
    const grassGeo = new THREE.BoxGeometry(SIZE - 2, 1, SIZE - 2);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x558b43 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.position.set(x * SIZE, 0, z * SIZE);
    grass.receiveShadow = true;
    mapGroup.add(grass);

    // Дороги (темные полосы)
    const roadGeo = new THREE.PlaneGeometry(SIZE, 4);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x2e243a });
    
    // Горизонтальная дорога
    if (z < N - 1) {
      const roadH = new THREE.Mesh(roadGeo, roadMat);
      roadH.rotation.x = -Math.PI / 2;
      roadH.position.set(x * SIZE, 0.51, z * SIZE + SIZE/2);
      roadH.receiveShadow = true;
      mapGroup.add(roadH);
    }
    // Вертикальная дорога
    if (x < N - 1) {
      const roadV = new THREE.Mesh(roadGeo, roadMat);
      roadV.rotation.x = -Math.PI / 2;
      roadV.rotation.z = Math.PI / 2;
      roadV.position.set(x * SIZE + SIZE/2, 0.51, z * SIZE);
      roadV.receiveShadow = true;
      mapGroup.add(roadV);
    }
  }
}

// Функция создания красивого 3D-домика
function createHouse(colorRoof = 0xc0392b) {
  const house = new THREE.Group();

  // Стены
  const wallGeo = new THREE.BoxGeometry(10, 8, 10);
  const wallMat = new THREE.MeshLambertMaterial({ color: 0xf0f0f0 });
  const walls = new THREE.Mesh(wallGeo, wallMat);
  walls.position.y = 4;
  walls.castShadow = true;
  walls.receiveShadow = true;
  house.add(walls);

  // Крыша (пирамида)
  const roofGeo = new THREE.ConeGeometry(8, 6, 4);
  const roofMat = new THREE.MeshLambertMaterial({ color: colorRoof });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = 8 + 3; // Над стенами
  roof.rotation.y = Math.PI / 4; // Выравниваем грани
  roof.castShadow = true;
  house.add(roof);

  // Дверь
  const doorGeo = new THREE.BoxGeometry(2, 4, 0.5);
  const doorMat = new THREE.MeshLambertMaterial({ color: 0x3b3b85 });
  const door = new THREE.Mesh(doorGeo, doorMat);
  door.position.set(0, 2, 5); // На передней стене
  house.add(door);

  return house;
}

// Ставим тестовые дома
const demoHouses = [
  { x: 3, z: 3, name: "vika_pro", color: 0xc0392b },
  { x: 5, z: 4, name: "danya_22", color: 0x2980b9 },
  { x: 2, z: 7, name: "oleg_nos", color: 0x8e44ad }
];

demoHouses.forEach(h => {
  const house = createHouse(h.color);
  house.position.set(h.x * SIZE, 0.5, h.z * SIZE);
  mapGroup.add(house);
});

// Центрируем камеру на карте
mapGroup.position.set(-N * SIZE / 2 + SIZE / 2, 0, -N * SIZE / 2 + SIZE / 2);
controls.target.set(0, 0, 0);

// 5. Анимация
function animate() {
  requestAnimationFrame(animate);
  controls.update(); // Обновляет вращение
  renderer.render(scene, camera);
}
animate();

// 6. Адаптация под размер экрана
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
