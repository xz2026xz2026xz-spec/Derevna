<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SUPABASE_URL = 'https://ajslzsjdzczkjlguouxd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_murTt1Egt-me5AZNAcht2g_3UxBef8i';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PASSWORD = 'admin';
const N = 12;
const SIZE = 20;
const DAY_CYCLE_SPEED = 0.005; 

let money = parseInt(localStorage.getItem('gameMoney')) || 0;
let myHouseNick = localStorage.getItem('myHouseNick') || '';
let isMeteorShower = false;
let meteorShowerTimer = 0;
let nextMeteorRealTime = getNextMidnight();

function getNextMidnight() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0).getTime();
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
camera.position.set(120, 150, 120); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.2;
controls.target.set(0, 0, 0);

// --- СВЕТ ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xfffbda, 1.2);
sunLight.position.set(100, 200, 100);
sunLight.castShadow = true; 
sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -250; sunLight.shadow.camera.right = 250; sunLight.shadow.camera.top = 250; sunLight.shadow.camera.bottom = -250;
scene.add(sunLight);

// --- ОБЛАКА ---
const cloudsGroup = new THREE.Group();
const cloudMat = new THREE.MeshLambertMaterial({color: 0xffffff, transparent: true, opacity: 0.9});
for(let i=0; i<15; i++){
    const cloud = new THREE.Group();
    for(let j=0; j<3; j++){
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(10 + Math.random()*10, 7, 7), cloudMat);
        sphere.position.set(Math.random()*15, Math.random()*5, Math.random()*10);
        cloud.add(sphere);
    }
    cloud.position.set((Math.random()-0.5)*600, 150 + Math.random()*50, (Math.random()-0.5)*600);
    cloudsGroup.add(cloud);
}
scene.add(cloudsGroup);

const mapGroup = new THREE.Group(); scene.add(mapGroup);
const housesGroup = new THREE.Group(); mapGroup.add(housesGroup);
let housesData = []; 
let isAdmin = false;
const lamps = []; 

// --- БАЗОВАЯ ПЛИТА ПОД КАРТОЙ ---
const basePlate = new THREE.Mesh(new THREE.BoxGeometry(N * SIZE + 10, 2, N * SIZE + 10), new THREE.MeshLambertMaterial({color: 0x5a8f3d}));
basePlate.position.set(0, -1, 0);
basePlate.receiveShadow = true;
mapGroup.add(basePlate);

// --- ГЕНЕРАЦИЯ КАРТЫ С ДЕТАЛЯМИ ---
for (let x = 0; x < N; x++) {
  for (let z = 0; z < N; z++) {
    // 1. Трава (с легким изменением цвета)
    const grassColor = Math.random() > 0.5 ? 0x7CFC00 : 0x6ecf00;
    const grass = new THREE.Mesh(new THREE.BoxGeometry(SIZE - 4, 1, SIZE - 4), new THREE.MeshLambertMaterial({ color: grassColor }));
    grass.position.set(x * SIZE, 0, z * SIZE); 
    grass.receiveShadow = true; 
    mapGroup.add(grass);

    // 2. Детали на траве (Деревья, кусты, цветы) - только если участок свободен
    if (Math.random() < 0.15) { // 15% шанс, что на участке будет дерево
        const treeGroup = new THREE.Group();
        // Ствол
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3), new THREE.MeshLambertMaterial({color: 0x8B4513}));
        trunk.position.y = 1.5; trunk.castShadow = true;
        treeGroup.add(trunk);
        // Крона (из нескольких шаров)
        const leavesMat = new THREE.MeshLambertMaterial({color: 0x228B22});
        const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(2.5, 6, 6), leavesMat); leaf1.position.y = 4; leaf1.castShadow = true; treeGroup.add(leaf1);
        const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(1.8, 6, 6), leavesMat); leaf2.position.set(1, 5, 0.5); leaf2.castShadow = true; treeGroup.add(leaf2);
        const leaf3 = new THREE.Mesh(new THREE.SphereGeometry(1.8, 6, 6), leavesMat); leaf3.position.set(-1, 5, -0.5); leaf3.castShadow = true; treeGroup.add(leaf3);
        
        treeGroup.position.set(x * SIZE + (Math.random()-0.5)*10, 0.5, z * SIZE + (Math.random()-0.5)*10);
        mapGroup.add(treeGroup);
    } else if (Math.random() < 0.3) {
        // Цветочки
        const flowerColor = [0xff69b4, 0xffff00, 0xffffff][Math.floor(Math.random()*3)];
        const flower = new THREE.Mesh(new THREE.SphereGeometry(0.3, 5, 5), new THREE.MeshBasicMaterial({color: flowerColor}));
        flower.position.set(x * SIZE + (Math.random()-0.5)*12, 0.8, z * SIZE + (Math.random()-0.5)*12);
        mapGroup.add(flower);
    }

    // 3. Дороги с бордюрами
    if (z < N - 1) {
      // Бордюр (серый)
      const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, 6), new THREE.MeshLambertMaterial({ color: 0x999999 }));
      sidewalk.rotation.x = -Math.PI / 2; sidewalk.position.set(x * SIZE, 0.51, z * SIZE + SIZE/2); sidewalk.receiveShadow = true; mapGroup.add(sidewalk);
      // Асфальт (темно-серый)
      const road = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, 4), new THREE.MeshLambertMaterial({ color: 0x333333 }));
      road.rotation.x = -Math.PI / 2; road.position.set(x * SIZE, 0.52, z * SIZE + SIZE/2); road.receiveShadow = true; mapGroup.add(road);
      // Разметка
      for (let i = -SIZE/2 + 2; i < SIZE/2; i += 6) {
        const dash = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.4), new THREE.MeshBasicMaterial({color: 0xffffff}));
        dash.rotation.x = -Math.PI / 2; dash.position.set(x * SIZE + i, 0.53, z * SIZE + SIZE/2); mapGroup.add(dash);
      }
    }
    if (x < N - 1) {
      const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, 6), new THREE.MeshLambertMaterial({ color: 0x999999 }));
      sidewalk.rotation.x = -Math.PI / 2; sidewalk.rotation.z = Math.PI / 2; sidewalk.position.set(x * SIZE + SIZE/2, 0.51, z * SIZE); sidewalk.receiveShadow = true; mapGroup.add(sidewalk);
      
      const road = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, 4), new THREE.MeshLambertMaterial({ color: 0x333333 }));
      road.rotation.x = -Math.PI / 2; road.rotation.z = Math.PI / 2; road.position.set(x * SIZE + SIZE/2, 0.52, z * SIZE); road.receiveShadow = true; mapGroup.add(road);
      
      for (let i = -SIZE/2 + 2; i < SIZE/2; i += 6) {
        const dash = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.4), new THREE.MeshBasicMaterial({color: 0xffffff}));
        dash.rotation.x = -Math.PI / 2; dash.rotation.z = Math.PI / 2; dash.position.set(x * SIZE + SIZE/2, 0.53, z * SIZE + i); mapGroup.add(dash);
      }
    }
    
    // 4. Фонари
    if (x < N - 1 && z < N - 1 && (x + z) % 3 === 0) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 12), new THREE.MeshLambertMaterial({ color: 0x888888 }));
      pole.position.set(x * SIZE + SIZE/2, 6, z * SIZE + SIZE/2); pole.castShadow = true; mapGroup.add(pole);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0x555555 }));
      bulb.position.set(x * SIZE + SIZE/2, 12, z * SIZE + SIZE/2); mapGroup.add(bulb);
      const pointLight = new THREE.PointLight(0xffdd55, 0, 30); pointLight.position.set(x * SIZE + SIZE/2, 12, z * SIZE + SIZE/2); mapGroup.add(pointLight);
      lamps.push({ bulb, light: pointLight });
    }
  }
}
mapGroup.position.set(-N * SIZE / 2 + SIZE / 2, 0, -N * SIZE / 2 + SIZE / 2);

// === ЧЕЛОВЕЧЕК ===
const playerGroup = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 5, 8), new THREE.MeshLambertMaterial({color: 0x3498db}));
pBody.position.y = 5; pBody.castShadow = true; playerGroup.add(pBody);
const pHead = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshLambertMaterial({color: 0xffcc99}));
pHead.position.y = 8; pHead.castShadow = true; playerGroup.add(pHead);
const legGeo = new THREE.CylinderGeometry(0.5, 0.5, 3, 6);
const legMat = new THREE.MeshLambertMaterial({color: 0x2c3e50});
const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.6, 1.5, 0); playerGroup.add(leftLeg);
const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.6, 1.5, 0); playerGroup.add(rightLeg);
const armGeo = new THREE.CylinderGeometry(0.4, 0.4, 2.5, 6);
const armMat = new THREE.MeshLambertMaterial({color: 0xffcc99});
const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-1.8, 5.5, 0); leftArm.rotation.z = 0.3; playerGroup.add(leftArm);
const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(1.8, 5.5, 0); rightArm.rotation.z = -0.3; playerGroup.add(rightArm);
playerGroup.visible = false;
scene.add(playerGroup); 

// --- ДОМА ---
function createNametag(text) {
  const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 64;
  ctx.fillStyle = '#f5e6a3'; ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#333'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false }));
  sprite.scale.set(14, 3.5, 1); sprite.position.y = 12;
  return sprite;
}

function createHouseObj(h) {
  const houseGroup = new THREE.Group();
  const walls = new THREE.Mesh(new THREE.BoxGeometry(6, 6, 6), new THREE.MeshLambertMaterial({ color: 0xeeeeee }));
  walls.position.y = 3; walls.castShadow = true; walls.receiveShadow = true; houseGroup.add(walls);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 4, 4), new THREE.MeshLambertMaterial({ color: 0x3b3b85 }));
  roof.position.y = 8; roof.rotation.y = Math.PI / 4; roof.castShadow = true; houseGroup.add(roof);
  houseGroup.add(createNametag(h.nickname));
  
  houseGroup.position.set(h.x * SIZE, 0.5, h.z * SIZE);
  houseGroup.userData = h;
  applyUpgradesToHouse(houseGroup);
  return houseGroup;
}

function applyUpgradesToHouse(mesh) {
  const h = mesh.userData;
  if (h.is_dead) { mesh.scale.set(0.1, 0.1, 0.1); return; }
  
  mesh.scale.y = 1 + (h.height_level - 1) * 0.3;
  mesh.position.y = 0.5 + (h.height_level - 1) * 2;

  const oldShield = mesh.children.find(c => c.geometry?.type === 'SphereGeometry');
  if (oldShield) mesh.remove(oldShield);
  
  if (h.has_shield) {
    const shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(8, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3, wireframe: true }));
    shieldMesh.position.y = 5;
    mesh.add(shieldMesh);
  }
}

function syncHouseToScene(h) {
  const existing = housesGroup.children.find(m => m.userData.nickname === h.nickname);
  if (existing) {
    existing.userData = h;
    applyUpgradesToHouse(existing);
    const idx = housesData.findIndex(d => d.nickname === h.nickname);
    if(idx !== -1) housesData[idx] = h;
  } else {
    const mesh = createHouseObj(h);
    housesGroup.add(mesh);
    housesData.push(h);
  }
}

function removeHouseFromScene(nickname) {
  const mesh = housesGroup.children.find(m => m.userData.nickname === nickname);
  if (mesh) housesGroup.remove(mesh);
  housesData = housesData.filter(h => h.nickname !== nickname);
}

async function loadHouses() {
  const { data, error } = await db.from('houses').select('*');
  if (error) { 
    console.error(error); 
    document.getElementById('netStatus').innerText = '🔴 БД: ' + error.message; 
    document.getElementById('netStatus').style.color = '#e74c3c';
    return; 
  }
  document.getElementById('netStatus').innerText = '🟢 Онлайн';
  document.getElementById('netStatus').style.color = '#2ecc71';
  
  [...housesGroup.children].forEach(m => housesGroup.remove(m));
  housesData = [];
  data.forEach(h => syncHouseToScene(h));
  updateUI();
}

db.channel('public:houses')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'houses' }, payload => {
    if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') syncHouseToScene(payload.new);
    else if (payload.eventType === 'DELETE') removeHouseFromScene(payload.old.nickname);
    updateUI();
  }).subscribe();

db.channel('meteors')
  .on('broadcast', { event: 'shower' }, payload => { if (!isMeteorShower) triggerMeteorShower(true); })
  .subscribe();

let isWalking = false, moveForward = 0, moveRight = 0;
const dpad = document.getElementById('dpad'), walkBtn = document.getElementById('walkBtn');

walkBtn.onclick = () => {
  isWalking = !isWalking; walkBtn.classList.toggle('active', isWalking);
  if (isWalking) {
    const myHouse = housesData.find(h => h.nickname === myHouseNick);
    if (myHouse && !myHouse.is_dead) {
      const wx = myHouse.x * SIZE + mapGroup.position.x;
      const wz = myHouse.z * SIZE + mapGroup.position.z;
      playerGroup.position.set(wx, 0, wz + 10); 
    } else {
      playerGroup.position.set(0, 0, 0);
    }
    
    playerGroup.visible = true;
    
    // === ОЧЕНЬ ВЫСОКАЯ КАМЕРА ===
    controls.minDistance = 40; 
    controls.maxDistance = 120; 
    controls.maxPolarAngle = Math.PI / 2.05;
    
    // Смотрим немного вперед
    controls.target.set(playerGroup.position.x, 5, playerGroup.position.z - 10);
    // Ставим камеру высоко и далеко сзади
    camera.position.set(playerGroup.position.x, 90, playerGroup.position.z + 70); 
    
    dpad.classList.add('show');
  } else {
    playerGroup.visible = false;
    controls.minDistance = 40; controls.maxDistance = 350; controls.maxPolarAngle = Math.PI / 2.2;
    controls.target.set(0, 0, 0); camera.position.set(120, 150, 120);
    dpad.classList.remove('show'); moveForward = 0; moveRight = 0;
  }
};

const setupBtn = (id, f, r) => {
  const el = document.getElementById(id);
  const start = (e) => { e.preventDefault(); moveForward = f; moveRight = r; };
  const end = (e) => { e.preventDefault(); moveForward = 0; moveRight = 0; };
  el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
  el.addEventListener('touchstart', start, {passive: false}); el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
};
setupBtn('btnUp', 1, 0); setupBtn('btnDown', -1, 0); setupBtn('btnLeft', 0, -1); setupBtn('btnRight', 0, 1);

const clock = new THREE.Clock();
let timeOfDay = 0.5; // Начинаем сразу днем

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  
  if (isWalking && (moveForward !== 0 || moveRight !== 0)) {
    const moveSpeed = 0.6;
    const forward = new THREE.Vector3(); camera.getWorldDirection(forward); forward.y = 0; forward.normalize();
    const right = new THREE.Vector3(); right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
    const moveDelta = new THREE.Vector3().addScaledVector(forward, moveForward * moveSpeed).addScaledVector(right, moveRight * moveSpeed);
    
    playerGroup.position.add(moveDelta);
    if (moveDelta.length() > 0) playerGroup.rotation.y = Math.atan2(moveDelta.x, moveDelta.z);
    
    controls.target.set(playerGroup.position.x, 5, playerGroup.position.z - 10);
    camera.position.add(moveDelta); 
  }

  if (!isMeteorShower) {
    const timeLeft = nextMeteorRealTime - Date.now();
    if (timeLeft <= 0) { triggerMeteorShower(true); nextMeteorRealTime = getNextMidnight(); } 
    else {
      const h = Math.floor(timeLeft / 3600000), m = Math.floor((timeLeft % 3600000) / 60000), s = Math.floor((timeLeft % 60000) / 1000);
      document.getElementById('meteorTimer').innerText = `☄️ До метеоритов: ${h}ч ${m}м ${s}с`;
    }
  } else {
    meteorShowerTimer -= delta;
    if (Math.random() < 0.1) spawnMeteor();
    if (meteorShowerTimer <= 0) isMeteorShower = false;
    document.getElementById('meteorTimer').innerText = `☄️ ДОЖДЬ: ${Math.ceil(meteorShowerTimer)}с!`;
  }

  // Летний цикл дня/ночи
  timeOfDay = (timeOfDay + delta * DAY_CYCLE_SPEED) % 1.0;
  const angle = timeOfDay * Math.PI * 2;
  const sunY = Math.sin(angle);
  sunLight.position.set(Math.cos(angle)*100, sunY*200, 100);
  
  if (sunY > 0) {
      sunLight.intensity = Math.min(1.5, sunY * 2.5);
      ambientLight.intensity = 0.4 + (sunY * 0.2);
      scene.background.setHex(0x87CEEB);
  } else {
      sunLight.intensity = 0; 
      ambientLight.intensity = 0.2;
      scene.background.setHex(0x111122);
  }

  lamps.forEach(l => { if (sunY < 0.1) { l.bulb.material.color.setHex(0xffdd55); l.light.intensity = 1.5; } else { l.bulb.material.color.setHex(0x555555); l.light.intensity = 0; } });
  
  // Плывущие облака
  cloudsGroup.children.forEach(c => {
      c.position.x += 0.05;
      if(c.position.x > 400) c.position.x = -400;
  });

  controls.update(); renderer.render(scene, camera);
}
animate();

function triggerMeteorShower(silent = false) {
  if (isMeteorShower) return;
  isMeteorShower = true; meteorShowerTimer = 10;
  if (!silent) alert('☄️ ВНИМАНИЕ! МЕТЕОРИТНЫЙ ДОЖДЬ! УКРОЙТЕСЬ!');
  db.channel('meteors').send({ type: 'broadcast', event: 'shower', payload: {} });
}

function spawnMeteor() {
  const targetX = (Math.random() - 0.5) * (N * SIZE) + mapGroup.position.x;
  const targetZ = (Math.random() - 0.5) * (N * SIZE) + mapGroup.position.z;
  const meteor = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4400 }));
  meteor.position.set(targetX + 50, 200, targetZ + 50); scene.add(meteor);
  const fallInterval = setInterval(() => {
    meteor.position.y -= 5; meteor.position.x -= 1.2; meteor.position.z -= 1.2; meteor.rotation.x += 0.1;
    if (meteor.position.y <= 0) { clearInterval(fallInterval); scene.remove(meteor); createExplosion(meteor.position.x, meteor.position.z); }
  }, 16);
}

function createExplosion(x, z) {
  const explosion = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.8 }));
  explosion.position.set(x, 2, z); scene.add(explosion);
  setTimeout(() => scene.remove(explosion), 500);

  housesData.forEach(h => {
    if (h.is_dead) return;
    const hX = h.x * SIZE + mapGroup.position.x, hZ = h.z * SIZE + mapGroup.position.z;
    const dist = Math.sqrt(Math.pow(x - hX, 2) + Math.pow(z - hZ, 2));
    
    // Если метеорит попал в дом
    if (dist < 8) {
      if (h.has_shield) {
        // Щит ломается
        db.from('houses').update({ has_shield: false }).eq('nickname', h.nickname).then();
      } else {
        // Дом рушится
        db.from('houses').update({ is_dead: true }).eq('nickname', h.nickname).then();
      }
    }
  });
}

window.openShop = () => { if (!myHouseNick) return alert('Сначала админ должен добавить твой ник!'); document.getElementById('shopModal').classList.add('show'); };
window.buyUpgrade = async (type) => {
  const house = housesData.find(h => h.nickname === myHouseNick);
  if (!house) return alert('Твой дом не найден!');
  if (house.is_dead) return alert('Твой дом разрушен! Попроси админа восстановить его.');

  if (type === 'height') {
    if (money < 30) return alert('Недостаточно денег!');
    money -= 30; updateUI();
    await db.from('houses').update({ height_level: house.height_level + 1 }).eq('nickname', myHouseNick);
  } else if (type === 'shield') {
    if (money < 50) return alert('Недостаточно денег!');
    if (house.has_shield) return alert('У тебя уже есть щит!');
    money -= 50; updateUI();
    await db.from('houses').update({ has_shield: true }).eq('nickname', myHouseNick);
  }
};

function updateUI() {
  document.getElementById('money').innerText = `$ ${money}`;
  document.getElementById('myHouseName').innerText = myHouseNick || 'Не выбран';
  localStorage.setItem('gameMoney', money);
}
setInterval(() => { money += 10; updateUI(); }, 60000);

document.getElementById('shopBtn').onclick = openShop;
document.getElementById('adminBtn').onclick = () => { if (!isAdmin) document.getElementById('loginModal').classList.add('show'); else document.getElementById('adminPanel').classList.toggle('open'); };
window.closeModal = (id) => document.getElementById(id).classList.remove('show');
window.checkPass = () => {
  if (document.getElementById('passInput').value === PASSWORD) { isAdmin = true; closeModal('loginModal'); document.getElementById('adminPanel').classList.add('open'); document.getElementById('adminBtn').classList.add('on'); } 
  else alert('Неверный пароль!');
};
window.logout = () => { isAdmin = false; document.getElementById('adminPanel').classList.remove('open'); document.getElementById('adminBtn').classList.remove('on'); };
window.triggerMeteor = () => triggerMeteorShower(false);

window.addHouses = async () => {
  const nicks = document.getElementById('nicksInput').value.split('\n').map(n => n.trim().replace(/^@/, '')).filter(n => n);
  let added = 0;
  const occupied = new Set(housesData.map(h => `${h.x},${h.z}`));
  
  for (const nick of nicks) {
    if (housesData.find(h => h.nickname === nick)) continue;
    let spot = null;
    for (let x = 0; x < N; x++) for (let z = 0; z < N; z++) if (!occupied.has(`${x},${z}`)) { spot = { x, z }; break; }
    if (!spot) break;
    occupied.add(`${spot.x},${spot.z}`);
    
    const { error } = await db.from('houses').insert({ nickname: nick, x: spot.x, z: spot.z, height_level: 1, has_shield: false, is_dead: false });
    if (error) {
      alert("Ошибка базы данных: " + error.message); return;
    }
    added++;
  }
  document.getElementById('nicksInput').value = '';
  alert(`Успешно добавлено: ${added}`);
  loadHouses(); 
};

window.clearAll = async () => { 
  if(confirm('Удалить ВСЕ дома с сервера?')) {
    const { error } = await db.from('houses').delete().neq('nickname', 'nobody');
    if (error) alert("Ошибка: " + error.message);
    else loadHouses();
  }
};

setTimeout(() => {
  let savedName = localStorage.getItem('myHouseNick');
  if (!savedName) {
    let name = prompt('Введи свой ник в TikTok (чтобы играть за свой дом):');
    if (name) { localStorage.setItem('myHouseNick', name.replace(/^@/, '')); myHouseNick = name.replace(/^@/, ''); }
  }
  updateUI(); loadHouses();
}, 1000);

document.getElementById('searchInput').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') {
    const q = this.value.trim().toLowerCase().replace(/^@/, '');
    const house = housesData.find(h => h.nickname.toLowerCase().includes(q));
    if (house) {
      const wp = new THREE.Vector3(house.x * SIZE, 0, house.z * SIZE); mapGroup.localToWorld(wp);
      controls.target.set(wp.x, 0, wp.z); camera.position.set(wp.x + 40, 40, wp.z + 40);
    } else alert('Не найден');
  }
});

window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
</script>
